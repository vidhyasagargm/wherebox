# Cache policy by path. Chosen with a map so every response keeps the security
# headers below (an add_header inside a location would silently drop them).
map $uri $wb_cache {
    ~^/assets/          "public, max-age=31536000, immutable";
    ~\.(png|ico|svg)$   "public, max-age=86400";
    default             "no-cache";
}

# Logs keep no IP addresses or browser details: only time, request and status.
log_format wb_noip '[$time_local] "$request" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    access_log /dev/stdout wb_noip;
    # Error lines include the client IP, so only log real failures, and no 404s.
    error_log /dev/stderr crit;
    log_not_found off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # sw.js, index.html and the manifest fall under "no-cache" so updates reach users.
    add_header Cache-Control $wb_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' data:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Backend (PocketBase) ---
    # Resolved when used, so the app still starts when no backend container runs.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $wb_backend http://pocketbase:8090;

    # Only what the app needs is forwarded. File URLs use the collection's internal id
    # (e.g. /api/files/pbc_710432678/<record>/<file>); they're protected by file tokens and view rules.
    # Everything else under /api/
    # (superuser login, settings, logs, backups, schema, batch, /api/wb/admin)
    # and the admin dashboard /_/ are not reachable from the internet.
    # Quoted because of the {15}: unquoted braces end the pattern in nginx.
    location ~ "^/api/(health|realtime|files/token|files/[a-z0-9_]+/[a-z0-9]{15}/[^/]+|collections/users/(request-otp|auth-with-otp|auth-refresh|records(/[a-z0-9]+)?)|collections/(lists|items)/records(/[a-z0-9]+)?|wb/(?!admin/).+)$" {
        proxy_pass $wb_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Realtime updates are a long-lived stream.
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 6m;
    }

    location /api/ {
        return 404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
