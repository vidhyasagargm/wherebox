# Home lab deployment. Point your Cloudflare Tunnel public hostname at
# http://wherebox:8080 (if cloudflared shares the "tunnel" network) or at
# http://<server-ip>:8080.
#
# Then:
#   docker compose pull && docker compose up -d
#
# The image is public once you make the GitHub package public; until then run
# `docker login ghcr.io` with a token that has read:packages.

services:
  wherebox:
    image: ghcr.io/vidhyasagargm/wherebox:latest
    container_name: wherebox
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Keep only a little log history (the logs contain no IP addresses).
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    networks: [tunnel]

  pocketbase:
    image: ghcr.io/vidhyasagargm/wherebox-backend:latest
    container_name: wherebox-backend
    restart: unless-stopped
    # Settings for sending sign-in emails (Brevo) and the public address. See backend.env.example.
    env_file: backend.env
    volumes:
      - pb_data:/pb_data
    # The admin dashboard is only reachable from this machine:
    #   ssh -L 8090:127.0.0.1:8090 you@server  →  http://localhost:8090/_/
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
    networks: [tunnel]

volumes:
  pb_data:

networks:
  # Use the same network your cloudflared container is on, or remove this.
  tunnel:
    name: tunnel
    external: false
