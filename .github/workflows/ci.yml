# Tests every push and pull request. On main and on version tags it also builds
# a multi-arch image (amd64 + arm64) and publishes it to GitHub Container Registry:
#
#   main         → ghcr.io/<owner>/wherebox:latest and :sha-<short>
#   tag v1.2.3   → :1.2.3 and :1.2
#
# Optional repository settings:
#   Variables  VITE_COFFEE_URL   Buy Me a Coffee link shown in Settings
#              VITE_IMPRINT      Imprint lines separated by | (name | street | city | email); a secret works too
#   Secrets    DEPLOY_WEBHOOK    URL called after a main build (Watchtower, Portainer, Komodo…)

name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  # Rebuild by hand, e.g. after changing a variable or secret.
  workflow_dispatch:

# Third-party actions are pinned to exact commits (a tag can be moved); Dependabot updates them.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Backend tests (real PocketBase)
        run: |
          V=$(cat backend/PB_VERSION)
          mkdir -p backend/.bin
          curl -fsSL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v$V/pocketbase_${V}_linux_amd64.zip"
          unzip -q /tmp/pb.zip pocketbase -d backend/.bin
          npm run test:backend

  # Every section of the app in real browsers, served by the real nginx.conf in front of a
  # real backend: Chromium, and WebKit as an iPhone (Safari's engine).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: PocketBase
        run: |
          V=$(cat backend/PB_VERSION)
          mkdir -p backend/.bin
          curl -fsSL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v$V/pocketbase_${V}_linux_amd64.zip"
          unzip -q /tmp/pb.zip pocketbase -d backend/.bin
      - run: sudo apt-get install -y --no-install-recommends nginx
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}

  # Pull requests build both images to catch Dockerfile problems; only pushes publish them.
  image:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_REPO_URL=${{ github.server_url }}/${{ github.repository }}
            VITE_COFFEE_URL=${{ vars.VITE_COFFEE_URL || 'https://buymeacoffee.com/vidhyasagar' }}
            VITE_IMPRINT=${{ vars.VITE_IMPRINT || secrets.VITE_IMPRINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tell the home lab to pull the new image
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then echo "No DEPLOY_WEBHOOK secret set, skipping."; exit 0; fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK"
