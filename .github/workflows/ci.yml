# Tests every push and pull request. On main and on version tags it also builds
# a multi-arch image (amd64 + arm64) and publishes it to GitHub Container Registry:
#
#   main         → ghcr.io/<owner>/wherebox:latest and :sha-<short>
#   tag v1.2.3   → :1.2.3 and :1.2
#
# Every run also builds the Android and iOS apps. A version tag signs the Android app
# and attaches wherebox-<version>.apk to the GitHub release (see docs/apps.md).
#
# Optional repository settings:
#   Variables  VITE_COFFEE_URL   Buy Me a Coffee link shown in Settings
#              VITE_IMPRINT      Imprint lines separated by | (name | street | city | email); a secret works too
#              VITE_API_URL      Server the phone apps use (default https://wherebox.sagar.fyi)
#              ANDROID_CERT_SHA256  Fingerprint of the app signing key, so invite links open the app
#   Secrets    DEPLOY_WEBHOOK    URL called after a main build (Watchtower, Portainer, Komodo…)
#              ANDROID_KEYSTORE  The app signing key: base64 of the .jks file
#              ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  # Rebuild by hand, e.g. after changing a variable or secret.
  workflow_dispatch:

# Third-party actions are pinned to exact commits (a tag can be moved); Dependabot updates them.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Backend tests (real PocketBase)
        run: |
          V=$(cat backend/PB_VERSION)
          mkdir -p backend/.bin
          curl -fsSL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v$V/pocketbase_${V}_linux_amd64.zip"
          unzip -q /tmp/pb.zip pocketbase -d backend/.bin
          npm run test:backend

  # Every section of the app in real browsers, served by the real nginx.conf in front of a
  # real backend: Chromium, and WebKit as an iPhone (Safari's engine).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: PocketBase
        run: |
          V=$(cat backend/PB_VERSION)
          mkdir -p backend/.bin
          curl -fsSL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v$V/pocketbase_${V}_linux_amd64.zip"
          unzip -q /tmp/pb.zip pocketbase -d backend/.bin
      - run: sudo apt-get install -y --no-install-recommends nginx
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}

  # Pull requests build both images to catch Dockerfile problems; only pushes publish them.
  image:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_REPO_URL=${{ github.server_url }}/${{ github.repository }}
            VITE_COFFEE_URL=${{ vars.VITE_COFFEE_URL || 'https://buymeacoffee.com/vidhyasagar' }}
            VITE_IMPRINT=${{ vars.VITE_IMPRINT || secrets.VITE_IMPRINT }}
            ANDROID_CERT_SHA256=${{ vars.ANDROID_CERT_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Android app. Signed only when the keystore secrets are set; tags must be signed.
  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_COFFEE_URL: ${{ vars.VITE_COFFEE_URL || 'https://buymeacoffee.com/vidhyasagar' }}
          VITE_IMPRINT: ${{ vars.VITE_IMPRINT || secrets.VITE_IMPRINT }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: npx cap sync android
      - name: Build the APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          WHEREBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WHEREBOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WHEREBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            export WHEREBOX_KEYSTORE="$RUNNER_TEMP/release.jks"
            (cd android && ./gradlew assembleRelease --no-daemon)
            cp android/app/build/outputs/apk/release/app-release.apk "out/wherebox-$V.apk"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::A release needs the ANDROID_KEYSTORE secrets (docs/apps.md)."; exit 1
          else
            (cd android && ./gradlew assembleRelease --no-daemon)
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/wherebox-$V-unsigned.apk"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: out/*.apk
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Wherebox ${TAG#v}" --generate-notes
          gh release upload "$TAG" out/*.apk --clobber

  # The iOS app, built for the simulator without signing: proves it compiles. Shipping it
  # needs an Apple Developer account (see docs/apps.md).
  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator
        run: |
          V=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$CODE" build

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tell the home lab to pull the new image
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_WEBHOOK" ]; then echo "No DEPLOY_WEBHOOK secret set, skipping."; exit 0; fi
          curl -fsS -X POST "$DEPLOY_WEBHOOK"
